<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layanan — Tirta Pakuan</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header"><div class="container nav-bar">
  <a class="brand" href="index.html"><span class="brand-logo">♧</span><span>Perumda <b>Tirta Pakuan</b><small>Informasi layanan</small></span></a>
  <button class="menu-toggle" aria-label="Buka navigasi" aria-expanded="false">☰</button>
  <nav class="nav-links" id="mainNav" aria-label="Navigasi utama"><a href="index.html">Beranda</a><a href="layanan.html" class="active">Semua layanan</a><a href="ticketing.html#daftar-tiket">Status tiket</a><a class="btn teal small" href="ticketing.html">Pusat layanan</a></nav>
</div></header>
<main class="service-detail-page"><div class="container">
  <div id="service-detail"></div>
</div></main>
<footer class="site-footer"><div class="container footer-bottom"><span>© 2026 Perumda Tirta Pakuan Kota Bogor — Halaman pengembangan (dummy).</span><a href="ticketing.html#daftar-tiket">Daftar &amp; status tiket →</a></div></footer>
<script src="js/main.js"></script>
<script>
(function () {
  const id = new URLSearchParams(location.search).get('id');
  const s = TP.SERVICE_CATALOG.find(item => item.id === id);
  const root = document.getElementById('service-detail');
  const category = item => item.formSchema ? 'jasa' : 'keluhan';
  const formUrl = item => `ticketing.html?type=${category(item)}&layanan=${item.id}#layanan-tiket`;
  if (!id) {
    root.innerHTML = `<div class="section-heading"><span class="eyebrow">LAYANAN TIRTA PAKUAN</span><h1>Pilih layanan sesuai kebutuhan Anda</h1><p>Baca detail layanan, lalu isi data yang diperlukan langsung di formulir pengajuan.</p></div>
      <div class="service-grid service-catalog">${TP.SERVICE_CATALOG.map(item => `<article class="service-card service-card--tile"><a class="service-tile-link" href="layanan.html?id=${item.id}"><span class="service-tile-art"><span class="service-tile-icon" aria-hidden="true">${item.icon || '♧'}</span></span><span class="service-tile-body"><strong>${item.nama}</strong><small>${item.deskripsi}</small></span></a><a class="service-card-detail" href="${formUrl(item)}">${category(item) === 'jasa' ? 'Ajukan layanan' : 'Buat laporan'} ↗</a></article>`).join('')}</div>`;
  } else if (!s) {
    document.title = 'Layanan tidak ditemukan — Tirta Pakuan';
    root.innerHTML = '<div class="detail-empty"><h1>Layanan tidak ditemukan</h1><p>Silakan pilih layanan dari daftar yang tersedia.</p><a class="btn" href="layanan.html">Lihat semua layanan</a></div>';
  } else {
    document.title = s.nama + ' — Tirta Pakuan';
    const fields = s.formSchema ? [...s.dataSchema, ...s.formSchema] : [{label:'Nama dan nomor WhatsApp'}, {label:'Alamat dan nomor pelanggan (jika ada)'}, {label:'Rincian keluhan'}];
    root.innerHTML = `<a class="service-back" href="layanan.html">← Kembali ke semua layanan</a><div class="detail-hero"><span class="eyebrow">${category(s) === 'jasa' ? 'LAYANAN JASA' : 'LAPOR KELUHAN'}</span><h1>${s.nama}</h1><p>${s.deskripsi}</p><div class="detail-hero-actions"><a class="btn teal" href="${formUrl(s)}">${category(s) === 'jasa' ? 'Ajukan layanan' : 'Buat laporan'} →</a><a class="btn ghost" href="ticketing.html#daftar-tiket">Lihat status tiket</a></div></div>
    <div class="detail-layout"><div class="detail-main">
      <section class="detail-section"><span class="detail-kicker">01 / ALUR PELAYANAN</span><h2>Bagaimana prosesnya?</h2><ol class="detail-process"><li><b>Isi formulir</b><span>Masukkan data pemohon dan detail kebutuhan secara online.</span></li><li><b>Verifikasi petugas</b><span>Petugas memeriksa data dan kondisi teknis sesuai layanan.</span></li><li><b>Konfirmasi tindak lanjut</b><span>Pantau status tiket untuk informasi survei, biaya, dan penyelesaian.</span></li></ol></section>
      <section class="detail-section"><span class="detail-kicker">02 / DATA FORMULIR</span><h2>Data yang diisi di sistem</h2><ul class="detail-checklist">${fields.map(f => `<li><span class="check-symbol">✓</span><span>${f.label}</span><small>${f.required === false ? 'Opsional' : 'Diisi di formulir'}</small></li>`).join('')}</ul></section>
      ${s.syarat ? `<section class="detail-section"><span class="detail-kicker">03 / KETENTUAN</span><h2>Yang perlu diketahui</h2><ul class="detail-terms">${s.syarat.map(x => `<li>${x.teks}</li>`).join('')}</ul></section>` : ''}
    </div><aside class="detail-side"><div class="detail-aside-card"><span class="detail-kicker">SEBELUM MENGAJUKAN</span><h3>Siapkan data Anda</h3><p>Formulir meminta identitas, nomor WhatsApp, alamat, dan rincian sesuai layanan yang dipilih.</p><div class="detail-fact"><b>Pengajuan melalui formulir</b><span>Isi data langsung di sistem untuk membuat tiket.</span></div><a class="btn teal" href="${formUrl(s)}">Mulai pengajuan →</a></div>${s.estimasi ? `<div class="detail-aside-note"><b>Perkiraan biaya</b><p>${s.estimasi}</p><small>Nominal akhir mengikuti pemeriksaan dan konfirmasi petugas.</small></div>` : ''}</aside></div>`;
  }
  document.querySelector('.menu-toggle').addEventListener('click', function () { const nav = document.getElementById('mainNav'); const open = nav.classList.toggle('open'); this.setAttribute('aria-expanded', String(open)); });
})();
</script>
</body>
</html>
